name: Verify public-data case
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/prepare_data.py
      - run: python scripts/prepare_project_evidence.py
      - run: python scripts/prepare_workforce_inputs.py
      - run: python scripts/prepare_documentation.py
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - run: impact-assessment build-site --output site
      - run: python scripts/workforce_browser_check.py
      - run: python -m build
      - name: Install wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/impact-clean"
          "$RUNNER_TEMP/impact-clean/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/impact-clean/bin/impact-assessment" validate
          "$RUNNER_TEMP/impact-clean/bin/impact-assessment" run --output clean-results
          "$RUNNER_TEMP/impact-clean/bin/impact-assessment" workforce --output clean-workforce
          "$RUNNER_TEMP/impact-clean/bin/impact-assessment" build-site --output clean-site
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
